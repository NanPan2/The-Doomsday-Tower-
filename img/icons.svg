    <rect x="30" y="48" width="4" height="10" fill="currentColor" opacity="0.2"/>
    <rect x="6" y="30" width="10" height="4" fill="currentColor" opacity="0.2"/>
    <rect x="48" y="30" width="10" height="4" fill="currentColor" opacity="0.2"/>
    <rect x="13" y="13" width="4" height="10" transform="rotate(45 15 18)" fill="currentColor" opacity="0.15"/>
    <rect x="47" y="13" width="4" height="10" transform="rotate(-45 49 18)" fill="currentColor" opacity="0.15"/>
    <rect x="13" y="41" width="4" height="10" transform="rotate(-45 15 46)" fill="currentColor" opacity="0.15"/>
    <rect x="47" y="41" width="4" height="10" transform="rotate(45 49 46)" fill="currentColor" opacity="0.15"/>
