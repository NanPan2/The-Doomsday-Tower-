    <line x1="56" y1="34" x2="60" y2="38" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <circle cx="14" cy="8" r="2" fill="currentColor" opacity="0.4"/>
    <circle cx="14" cy="56" r="2" fill="currentColor" opacity="0.4"/>
  </symbol>

