    <ellipse cx="32" cy="32" rx="14" ry="9" fill="currentColor" opacity="0.1"/>
    <circle cx="32" cy="32" r="6" fill="currentColor" opacity="0.2"/>
    <circle cx="32" cy="32" r="3" fill="currentColor" opacity="0.3"/>
