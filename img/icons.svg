    <line x1="20" y1="24" x2="44" y2="40" stroke="currentColor" stroke-width="1" opacity="0.3"/>
    <line x1="44" y1="24" x2="20" y2="40" stroke="currentColor" stroke-width="1" opacity="0.3"/>
