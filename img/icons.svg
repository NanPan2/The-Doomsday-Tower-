    <line x1="32" y1="50" x2="32" y2="56" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
    <line x1="8" y1="32" x2="14" y2="32" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
