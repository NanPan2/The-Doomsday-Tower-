    <path d="M8 48l8 0 0 8-4 4-8-8z" fill="currentColor" opacity="0.9" transform="rotate(180 12 52)"/>
    <path d="M52 52l-18-18M34 34l-4-4M30 30L12 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M8 8l8 0 0 8-4 4-8-8z" fill="currentColor" opacity="0.9" transform="rotate(90 12 12)"/>
    <path d="M56 48l-8 0 0 8 4 4 8-8z" fill="currentColor" opacity="0.9" transform="rotate(0 52 52)"/>
