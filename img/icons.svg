    <line x1="50" y1="20" x2="46" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
    <line x1="50" y1="44" x2="46" y2="42" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
    <line x1="14" y1="20" x2="18" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
