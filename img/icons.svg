    <path d="M54 32Q48 40 42 34" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.15"/>
    <path d="M32 18Q38 22 36 28" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.15"/>
    <path d="M32 46Q26 42 28 36" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.15"/>
