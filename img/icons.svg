    <polygon points="30,40 26,50 30,48" fill="currentColor" opacity="0.7"/>
    <polygon points="34,40 38,50 34,48" fill="currentColor" opacity="0.7"/>
    <polygon points="30,44 24,54 30,50" fill="currentColor" opacity="0.5"/>
    <polygon points="34,44 40,54 34,50" fill="currentColor" opacity="0.5"/>
