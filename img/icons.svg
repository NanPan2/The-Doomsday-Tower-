    <line x1="32" y1="54" x2="32" y2="60" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <line x1="8" y1="26" x2="14" y2="26" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <line x1="50" y1="26" x2="56" y2="26" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <!-- Light rays -->
    <line x1="18" y1="12" x2="22" y2="16" stroke="currentColor" stroke-width="0.8" opacity="0.15"/>
    <line x1="46" y1="12" x2="42" y2="16" stroke="currentColor" stroke-width="0.8" opacity="0.15"/>
    <circle cx="32" cy="26" r="4" fill="currentColor" opacity="0.15"/>
