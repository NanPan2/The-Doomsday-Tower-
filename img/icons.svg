    <circle cx="44" cy="16" r="1.5" fill="currentColor" opacity="0.2"/>
    <circle cx="20" cy="48" r="1.5" fill="currentColor" opacity="0.2"/>
    <circle cx="44" cy="48" r="1.5" fill="currentColor" opacity="0.2"/>
