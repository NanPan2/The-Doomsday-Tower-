  <!-- Neutral: Diamond -->
  <symbol id="icon-pack-neutral" viewBox="0 0 64 64">
    <polygon points="32,8 56,32 32,56 8,32" fill="currentColor" opacity="0.12"/>
    <polygon points="32,8 56,32 32,56 8,32" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
    <polygon points="32,16 48,32 32,48 16,32" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
    <line x1="32" y1="8" x2="32" y2="56" stroke="currentColor" stroke-width="0.8" opacity="0.15"/>
    <line x1="8" y1="32" x2="56" y2="32" stroke="currentColor" stroke-width="0.8" opacity="0.15"/>
