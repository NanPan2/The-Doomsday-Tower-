<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ff8c00"/>
      <stop offset="100%" style="stop-color:#cc2200"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#ffd700" stroke-width="2" opacity="0.9"/>
  <!-- Tower base -->
  <rect x="22" y="28" width="20" height="28" rx="2" fill="url(#towerGrad)" opacity="0.9"/>
  <!-- Tower top (pointed) -->
  <polygon points="20,28 32,8 44,28" fill="url(#towerGrad)"/>
  <!-- Tower window slots -->
  <rect x="26" y="32" width="5" height="5" rx="1" fill="#0a0a14" opacity="0.7"/>
  <rect x="33" y="32" width="5" height="5" rx="1" fill="#0a0a14" opacity="0.7"/>
  <rect x="26" y="40" width="5" height="5" rx="1" fill="#0a0a14" opacity="0.7"/>
  <rect x="33" y="40" width="5" height="5" rx="1" fill="#0a0a14" opacity="0.7"/>
  <rect x="26" y="48" width="5" height="5" rx="1" fill="#0a0a14" opacity="0.7"/>
  <rect x="33" y="48" width="5" height="5" rx="1" fill="#0a0a14" opacity="0.7"/>
  <!-- Glow at top -->
  <circle cx="32" cy="10" r="4" fill="#ffd700" opacity="0.6"/>
  <circle cx="32" cy="10" r="2" fill="#fff" opacity="0.8"/>
  <!-- Small flames/energy at base -->
  <ellipse cx="26" cy="56" rx="3" ry="2" fill="#ff4400" opacity="0.5"/>
  <ellipse cx="38" cy="56" rx="3" ry="2" fill="#ff4400" opacity="0.5"/>
</svg>
